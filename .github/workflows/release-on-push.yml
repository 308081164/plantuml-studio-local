# 推送至 main 时：补丁版本 +1 → 提交 [skip ci] → 打 tag → 构建 Windows 安装包 → 发布到 GitHub Releases
# 构建产物目录与本地一致：releases/（安装包与便携版 .exe 一并上传）
# 可选：将发布元数据 POST 到自建服务器（见 docs/github-actions-secrets.md）

name: Release on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: windows-latest
    outputs:
      new_version: ${{ steps.version_out.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bump patch version
        id: version_out
        shell: bash
        run: |
          set -e
          V=$(node scripts/ci-bump-version.mjs)
          echo "NEW_VERSION=$V" >> "$GITHUB_ENV"
          echo "new_version=$V" >> "$GITHUB_OUTPUT"
          echo "Bumped to $V"

      - name: Commit version bump and tag
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/v${NEW_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare JRE
        run: npm run prepare:jre

      - name: Build Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Upload to GitHub Releases
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: v${{ env.NEW_VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.NEW_VERSION, '-') }}
          fail_on_unmatched_files: false
          files: |
            releases/*.exe
            releases/*.blockmap

  update-infra-release-meta:
    needs: build-and-release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Post release metadata to studio server
        env:
          STUDIO_RELEASE_INJECT_URL: ${{ secrets.STUDIO_RELEASE_INJECT_URL }}
          STUDIO_RELEASE_INJECT_TOKEN: ${{ secrets.STUDIO_RELEASE_INJECT_TOKEN }}
        run: |
          set -e
          if [ -z "${STUDIO_RELEASE_INJECT_URL}" ] || [ -z "${STUDIO_RELEASE_INJECT_TOKEN}" ]; then
            echo "STUDIO_RELEASE_INJECT_URL / STUDIO_RELEASE_INJECT_TOKEN 未配置，跳过服务器元数据更新。"
            exit 0
          fi
          TAG="v${{ needs.build-and-release.outputs.new_version }}"
          BODY=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "$TAG" \
            --arg sha "${{ github.sha }}" \
            --arg wf "${{ github.workflow }}" \
            --arg html "https://github.com/${{ github.repository }}/releases/tag/${TAG}" \
            '{repository:$repo, tag:$tag, sha:$sha, workflow:$wf, html_url:$html}')
          curl -fsS -X POST "$STUDIO_RELEASE_INJECT_URL" \
            -H "Authorization: Bearer ${STUDIO_RELEASE_INJECT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY"

  deploy-pay-server:
    needs: [build-and-release, update-infra-release-meta]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy server directory and restart Docker
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
        run: |
          set -e
          if [ -z "${SSH_HOST}" ]; then
            echo "未配置 SSH_HOST，跳过服务端部署。"
            exit 0
          fi
          if [ -z "${SSH_SECRET}" ]; then
            echo "已配置 SSH_HOST 但未配置 SSH_SECRET，无法部署。"
            exit 1
          fi
          USER="${SSH_USER:-root}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 规范化私钥：去掉 Windows CRLF，避免 ssh-add 报 error in libcrypto
          tr -d '\r' <<< "${SSH_SECRET}" > ~/.ssh/id_ci_deploy
          chmod 600 ~/.ssh/id_ci_deploy
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ci_deploy
          rm -f ~/.ssh/id_ci_deploy
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          DEST="${USER}@${SSH_HOST}:~/plantuml-pay-server/"
          rsync -avz -e ssh --delete \
            --exclude node_modules \
            --exclude data \
            --exclude .env \
            ./server/ "${DEST}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${USER}@${SSH_HOST}" \
            "set -e; cd ~/plantuml-pay-server && docker compose up -d --build"
